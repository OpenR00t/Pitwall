# Tests on every push and pull request. The real-session tests need a local
# FastF1 cache, so they don't run here (see README, Tests).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Unit and demo tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Versions agree
        run: python scripts/set_version.py --check

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Scripts parse
        run: for f in ui/*.js ui/lib/*.js ui/views/*.js; do node --check "$f"; done

  shell:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Desktop shell compiles
        working-directory: src-tauri
        run: cargo check
